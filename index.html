function gcode(i,v){const r=G.rows[i],p=S.parts.find(x=>x.c===+v),n=document.getElementById('g'+i+'n'),u=document.getElementById('g'+i+'unit');r.code=v;if(p){r.n=p.n;r.unit=p.u;n.value=p.n;u.value=p.u;n.placeholder=''}else n.placeholder=v?'কোড পাওয়া যায়নি':''}
function gAdd(){G.rows.push(GR());go()}
function gDel(i){G.rows.splice(i,1);if(!G.rows.length)G.rows=[GR()];go()}
function gNew(t){GI=-1;G=gblank();G.type=t;if(t==='dlv')G.name=G.addr=G.mob='';GV='edit';go()}
function gOpen(i,v){GI=i;G=JSON.parse(JSON.stringify(S.gps[i]));GV=v;go()}
function gDelete(i){const g=S.gps[i];S.logs.rec=S.logs.rec.filter(e=>e.gid!==g.id);S.logs.tran=S.logs.tran.filter(e=>e.gid!==g.id);S.gps.splice(i,1);save();go()}
function gSave(pr){
 const rows=G.rows.filter(r=>r.code||r.n||r.qty),ok=rows.filter(r=>S.parts.some(p=>p.c===+r.code)&&+r.qty>0);
 if(G.type==='dlv'&&!G.to){$('#gm').textContent='To (কোথায় পাঠানো হচ্ছে) বাছুন।';return}
 if(!G.date||!ok.length){$('#gm').textContent='তারিখ আর অন্তত একটি সারিতে সঠিক কোড ও পরিমান দিতে হবে।';return}
 G.rows=rows;G.id=G.id||Date.now();
 S.logs.rec=S.logs.rec.filter(e=>e.gid!==G.id);S.logs.tran=S.logs.tran.filter(e=>e.gid!==G.id);
 ok.forEach(r=>G.type==='dlv'?S.logs.tran.push({date:G.date,gp:G.no,depot:G.depot,to:G.to,dlv:G.name,mode:G.mode,item:+r.code,qty:+r.qty,by:G.prep,rem:r.rem,gid:G.id}):S.logs.rec.push({date:G.date,gp:G.no,from:G.from||'Factory',depot:G.depot,mode:G.mode,item:+r.code,qty:+r.qty,by:G.recv,rem:r.rem,gid:G.id}));
 if(GI<0){S.gps.push(G);GI=S.gps.length-1}else S.gps[GI]=G;
 save();GM='সেভ হয়েছে। '+G.depot+(G.type==='dlv'?' ডিপোর Transfer-এ '+ok.length+'টি আইটেম যোগ হয়েছে (স্টক কমেছে)':' ডিপোর Received-এ '+ok.length+'টি আইটেম যোগ হয়েছে')+(rows.length>ok.length?'; '+(rows.length-ok.length)+'টি সারিতে কোড/পরিমান ঠিক না থাকায় স্টকে যোগ হয়নি':'')+'।';
 GV=pr?'view':'list';go();if(pr)setTimeout(()=>window.print(),200);
}
function vGp(){
 if(GV==='edit')return gForm();
 if(GV==='view')return gView(S.gps[GI]);
 if(GV==='prev')return gView(G,1);
 const m=GM;GM='';
 return`<div class="bar"><button class="btn" onclick="gNew('rec')">+ রিসিভ গেটপাস</button><button class="btn" onclick="gNew('dlv')">+ ডেলিভারী গেটপাস</button>${tools('gp')}</div>${m?`<p class="sub" style="margin:0 0 10px">${esc(m)}</p>`:''}<div class="wrap">${S.gps.length?`<table><tr><th>ক্রমিক নং</th><th>তারিখ</th><th>ধরন</th><th>Depot</th><th class="n">আইটেম</th><th>পরিবহন</th><th></th></tr>${S.gps.map((g,i)=>`<tr><td>${esc(g.no)}</td><td>${fd(g.date)}</td><td>${g.type==='dlv'?'ডেলিভারী':'রিসিভ'}</td><td>${esc(g.depot)}${g.type==='dlv'?' → '+esc(g.to):''}</td><td class="n">${g.rows.length}</td><td>${esc(g.mode)}</td><td><button class="btn g" onclick="gOpen(${i},'view')">দেখুন</button> <button class="btn g" onclick="gOpen(${i},'edit')">এডিট</button> <button class="x" title="Delete" onclick="gDelete(${i})">×</button></td></tr>`).join('')}</table>`:'<div class="empty">কোনো গেটপাস নেই।</div>'}</div><p class="note">রিসিভ গেটপাস সেভ করলে আইটেমগুলো Received ট্যাবে যোগ হয় (স্টক বাড়ে)। ডেলিভারী গেটপাস সেভ করলে Transfer ট্যাবে যোগ হয় (ঐ ডিপোর স্টক কমে)। গেটপাস এডিট করলে সেই এন্ট্রিও বদলায়, মুছলে এন্ট্রিও মুছে যায়।</p>`;
}

const stat=t=>{const e=$('#sync');if(e)e.textContent=t};
const LK=['rec','pur','used','tran','dam','sort','svc'];
const hx=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function kvGet(n){if(DB){const s=await DB.doc('state/'+n).get();return s.exists?JSON.parse(s.data().j):null}try{return JSON.parse(localStorage.getItem('sp-'+n))}catch(e){return null}}
async function kvSet(n,v){const j=JSON.stringify(v);if(DB)await DB.doc('state/'+n).set({j});else try{localStorage.setItem('sp-'+n,j)}catch(e){}}
const pack=()=>{const o={core:{parts:S.parts,open:S.open},jobs:S.jobs||[],gps:S.gps||[],vch:S.vch||[]};LK.forEach(k=>o[k]=S.logs[k]||[]);return o};
async function pull(){const c=await kvGet('core');if(!c)return false;const n={parts:c.parts,open:c.open,logs:{},jobs:await kvGet('jobs')||[],gps:await kvGet('gps')||[],vch:await kvGet('vch')||[]};for(const k of LK)n.logs[k]=await kvGet(k)||[];S=n;lastJ=Object.fromEntries(Object.entries(pack()).map(([k,v])=>[k,JSON.stringify(v)]));return true}
async function push(){const o=pack();for(const k in o){const j=JSON.stringify(o[k]);if(lastJ[k]!==j){await kvSet(k,o[k]);lastJ[k]=j}}}
async function enter(){try{if(DB){if(!(await pull()))await push();READY=true}}catch(e){READY=false}go()}
async function sync(){if(!DB)return;stat('লোড হচ্ছে…');try{await pull();READY=true;go()}catch(e){stat('সিঙ্ক ব্যর্থ')}}
function logout(){try{localStorage.removeItem('sp-login')}catch(e){}USER=null;go()}
function showLogin(){
 const f=!AUTH.users.length,a=f?'doSetup()':'doLogin()';
 $('#nav').innerHTML='';$('#ub').innerHTML='';
 $('#app').innerHTML=`<div class="login"><h2 style="margin:0">${f?'প্রথমবার সেটআপ':'Sign in'}</h2><p class="sub" style="margin:0">${f?'অ্যাডমিন ইউজারনেম ও পাসওয়ার্ড (কমপক্ষে ৪ অক্ষর) ঠিক করুন।':'ইউজারনেম ও পাসওয়ার্ড দিন।'}</p><label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="${f?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')${a}"></label><button class="btn" onclick="${a}">${f?'অ্যাডমিন তৈরি করুন':'Sign in'}</button><span class="sub" id="lm"></span></div>`;
}
async function mkUser(u,p,admin){const s=Math.random().toString(36).slice(2)+Date.now().toString(36);return{u,s,h:await hx(s+p),admin}}
async function doSetup(){const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||p.length<4){$('#lm').textContent='ইউজারনেম দিন, পাসওয়ার্ড কমপক্ষে ৪ অক্ষর।';return}USER=await mkUser(u,p,true);AUTH.users.push(USER);try{await kvSet('auth',AUTH)}catch(e){}loginOk()}
async function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value,r=AUTH.users.find(x=>x.u===u);if(r&&r.h===await hx(r.s+p)){USER=r;loginOk()}else $('#lm').textContent='ইউজারনেম বা পাসওয়ার্ড ভুল।'}
function loginOk(){try{localStorage.setItem('sp-login',JSON.stringify({u:USER.u,h:USER.h}))}catch(e){}$('#app').innerHTML='<div class="empty">লোড হচ্ছে…</div>';enter()}
async function boot(){
 $('#app').innerHTML='<div class="empty">লোড হচ্ছে…</div>';
 try{if(window.claude&&claude.use)DB=await claude.use('db')}catch(e){DB=null}
 try{AUTH=(await kvGet('auth'))||{users:[]}}catch(e){DB=null;AUTH=(await kvGet('auth'))||{users:[]}}
 let r=null;try{r=JSON.parse(localStorage.getItem('sp-login'))}catch(e){}
 const u=r&&AUTH.users.find(x=>x.u===r.u&&x.h===r.h);
 if(u){USER=u;enter()}else showLogin();
}
function vUs(){return`<div class="fm2"><label>Username<input id="nu"></label><label>Password<input id="np" type="password"></label><label>&nbsp;<button class="btn" onclick="addU()">ইউজার যোগ</button></label></div><div class="wrap" style="margin-top:12px"><table><tr><th>Username</th><th>Role</th><th></th></tr>${AUTH.users.map((u,i)=>`<tr><td>${esc(u.u)}</td><td>${u.admin?'Admin':'User'}</td><td>${u.u===USER.u?'':`<button class="x" onclick="delU(${i})">×</button>`}</td></tr>`).join('')}</table></div><p class="note">এখানে শুধু অ্যাডমিন ইউজার যোগ বা মুছতে পারেন।</p>`}
async function addU(){const u=$('#nu').value.trim(),p=$('#np').value;if(!u||p.length<4||AUTH.users.some(x=>x.u===u))return;AUTH.users.push(await mkUser(u,p,false));try{await kvSet('auth',AUTH)}catch(e){}go()}
async function delU(i){AUTH.users.splice(i,1);try{await kvSet('auth',AUTH)}catch(e){}go()}
let gt=0;
const dlSave=async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()};
const snap=()=>JSON.stringify({v:1,at:new Date().toISOString(),S,AUTH});
function bk(){dlSave({filename:'spare-backup-'+today+'.json',data:snap()});stat('ব্যাকআপ ফাইল নামানো হয়েছে')}
function rstF(i){const f=i.files[0];if(!f)return;f.text().then(applyBk).catch(()=>stat('ফাইল ঠিক নয়'));i.value=''}
function applyBk(t){const o=JSON.parse(t);if(!o.S||!o.S.parts)throw new Error('bad');S=o.S;if(o.AUTH&&o.AUTH.users)AUTH=o.AUTH;kvSet('auth',AUTH);save();USER=AUTH.users.find(x=>x.u===USER.u)||USER;go();stat('রিস্টোর হয়েছে ✓')}
const ghc=()=>{try{return JSON.parse(localStorage.getItem('sp-gh'))}catch(e){return null}};
async function ghRun(op){
 const c=ghc();if(!c)throw new Error('সেটিং নেই');
 const u='https://api.github.com/repos/'+c.repo+'/contents/'+c.path,h={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};
 const g=await fetch(u,{headers:h});
 if(op==='put'){const b={message:'backup '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(snap())))};if(g.ok)b.sha=(await g.json()).sha;const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status)}
 else{if(!g.ok)throw new Error(g.status);applyBk(decodeURIComponent(escape(atob((await g.json()).content.replace(/\n/g,'')))))}
}
function ghSet(){const repo=prompt('ব্যাকআপ রিপোজিটরি (যেমন myname/spare-backup)। অবশ্যই PRIVATE repo দিন:');if(!repo)return;const token=prompt('GitHub Personal Access Token (শুধু ঐ repo-র Contents: Read and write):');if(!token)return;localStorage.setItem('sp-gh',JSON.stringify({repo:repo.trim(),token:token.trim(),path:'spare-parts-data.json'}));stat('GitHub সেট হয়েছে')}
async function ghSync(){const k=prompt('1 = GitHub সেটিং\n2 = এখনই GitHub-এ ব্যাকআপ\n3 = GitHub থেকে ডেটা ফিরিয়ে আনুন');try{if(k==='1')ghSet();else if(k==='2'){stat('ব্যাকআপ হচ্ছে…');await ghRun('put');stat('GitHub ব্যাকআপ ✓')}else if(k==='3'){stat('লোড হচ্ছে…');await ghRun('get')}}catch(e){stat('GitHub ব্যর্থ ('+e.message+')')}}
function go(){
 if(!USER){showLogin();return}
 $('#ub').innerHTML=`👤 ${esc(USER.u)} · <span id="sync">${DB?(READY?'সিঙ্ক ✓':''):'শুধু এই ডিভাইসে'}</span> <button class="btn g" onclick="sync()">↻</button> <button class="btn g" onclick="logout()">Logout</button> <button class="btn g" onclick="bk()">Backup</button> <button class="btn g" onclick="document.getElementById('rf').click()">Restore</button> <button class="btn g" onclick="ghSync()">GitHub</button><input type="file" id="rf" accept=".json" hidden onchange="rstF(this)">`;
 if(!S.logs.svc)S.logs.svc=SVC0.map(x=>({...x}));
 if(!S.jobs)S.jobs=[JOB0];if(!S.gps)S.gps=[];if(!S.vch)S.vch=[];
 $('#nav').innerHTML=TABS.filter(t=>t[0]!=='us'||USER.admin).map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';go()">${t[1]}</button>`).join('');
 $('#sub').textContent='Dhaka Icecream Ind. Ltd. · Fuldeghi, Shahajahanpur, Bogura · Cold Store & Ref. Van yearly statement';
 $('#app').innerHTML=(tab==='st'?vSt():tab==='pl'?vPl():tab==='op'?vOp():tab==='job'?vJob():tab==='gp'?vGp():tab==='vch'?vVch():tab==='us'?vUs():vLog(tab))+`<p class="note"><button class="btn g" id="rb" onclick="reset()">Reset data</button></p>`;
}
boot();
</script></body></html>
